<!DOCTYPE html><html><head><meta charset="utf-8"><title>Diamond Clicker</title><style>body{margin:0;background:#0d1117;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;display:flex;height:100vh;overflow:hidden;user-select:none}#left,#right{padding:20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}#left{flex:1;justify-content:center;border-right:1px solid #21262d;background:radial-gradient(circle,rgba(22,39,63,1) 0%,rgba(13,17,23,1) 100%)}#right{width:360px;overflow-y:auto;background:#161b22;gap:10px}#diamond{width:160px;height:160px;position:relative;cursor:pointer;transition:transform 0.05s active;margin:40px 0;filter:drop-shadow(0 0 25px rgba(0,212,255,0.6))}#diamond:active{transform:scale(0.92)}#diamond::before{content:"";position:absolute;top:0;left:20px;width:120px;height:50px;background:linear-gradient(135deg,#9ae7ff,#00d4ff);clip-path:polygon(20% 0%,80% 0%,100% 100%,0% 100%)}#diamond::after{content:"";position:absolute;top:50px;left:20px;width:120px;height:110px;background:linear-gradient(225deg,#00b4db,#0083b0);clip-path:polygon(0% 0%,100% 0%,50% 100%)}.up-btn{width:100%;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px;color:#fff;text-align:left;cursor:pointer;display:flex;justify-content:between;align-items:center;transition:0.2s}.up-btn:hover:not(:disabled){background:#30363d;border-color:#8b949e}.up-btn:disabled{opacity:0.4;cursor:not-allowed}h1{font-size:2.5rem;margin:5px 0;color:#00d4ff;text-shadow:0 0 10px rgba(0,212,255,0.3)}h3{margin:0 0 15px 0;color:#8b949e}</style></head><body><div id="left"><h1 id="count">0 Diamonds</h1><div id="rate">0/s</div><div id="diamond" onclick="clickGem()"></div></div><div id="right"><h3>Shop Upgrades</h3><div id="shop" style="width:100%;display:flex;flex-direction:column;gap:8px"></div></div><script>let d=0,cps=0,dpc=1;const names=["Shovel","Pickaxe","Drill","Blaster","Excavator","Laser","Sonic Wave","Plasma Cutter","Quantum Ripper","Mined Worker","Automation Bot","Drill Rig","Sub-Crust Base","Core Harvester","Orbital Laser","Matter Synth","Singularity Pump","Galactic Core"];const shop=document.getElementById("shop");const ups=Array.from({length:18},(_,i)=>({id:i,name:names[i]||`Upgrade ${i+1}`,cost:Math.round(i<9?15*Math.pow(2.8,i):100*Math.pow(3.2,i-9)),count:0,type:i<9?"c":"a",power:i<9?Math.pow(2,i):Math.pow(4,i-9)}));function fmt(n){return n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(2)+"K":Math.floor(n)}function clickGem(){d+=dpc;u()}function buy(id){let item=ups[id];if(d>=item.cost){d-=item.cost;item.count++;if(item.type==="c")dpc+=item.power;else cps+=item.power;item.cost=Math.round(item.cost*1.15);u()}}function u(){document.getElementById("count").innerText=`${fmt(d)} Diamonds`;document.getElementById("rate").innerText=`+${fmt(cps)}/s (+${fmt(dpc)}/click)`;shop.innerHTML=ups.map(item=>`<button class="up-btn" onclick="buy(${item.id})" ${d<item.cost?'disabled':''}><div style="flex:1"><b style="color:#00d4ff">${item.name}</b><br><small style="color:#8b949e">Owned: ${item.count} (+${fmt(item.power)}${item.type==='c'?'/clk':'/s'})</small></div><span style="font-weight:bold;color:#58a6ff">💎${fmt(item.cost)}</span></button>`).join("");}setInterval(()=>{d+=cps/10;u()},100);u();</script></body></html>
